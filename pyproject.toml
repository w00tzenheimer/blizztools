[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blizztools"
version = "0.1.1"
description = "blizztools"
dependencies = [
    "construct",
    "click",
    "httpx[http2]",
    "rich",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-httpx",
    "pytest-asyncio",
]
ui = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
blizztools = "blizztools.main:main"

[tool.setuptools.packages.find]
include = ["blizztools*"]
exclude = ["tests*", "smoke_*", "ui_*"]

[tool.setuptools.package-data]
blizztools = ["webui/static/*"]
